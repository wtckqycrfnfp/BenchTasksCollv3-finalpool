name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-finalpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build finalpool branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wtckqycrfnfp"
          git config user.email "ops@wtckqycrfnfp.local"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout --orphan finalpool-build origin/main
          git rm -rf --quiet .
          mkdir -p tasks/finalpool

          ENTRIES=$(cat <<'EOF'
          origin/fan fan coupon-manager
          origin/fan fan discount-calculator
          origin/fan fan loyalty-program
          origin/fan fan price-tracker
          origin/gyy gyy blog-engine
          origin/gyy gyy cms-builder
          origin/gyy gyy content-scheduler
          origin/gyy gyy robots-handler
          origin/gyy gyy social-publisher
          origin/gyy gyy tag-manager
          origin/haoze haoze media-organizer
          origin/haoze haoze streaming-service
          origin/haoze haoze subtitle-generator
          origin/haoze haoze video-trimmer
          origin/jl_dev jl canvas-grade-automation
          origin/jl_dev jl customer-feedback-processor
          origin/jl_dev jl email-classification-system
          origin/jl_dev jl inventory-management
          origin/jl_dev jl pdf-report-generator
          origin/junteng_dev junteng booking-system
          origin/junteng_dev junteng calendar-sync
          origin/junteng_dev junteng contact-manager
          origin/junteng_dev junteng help-desk
          origin/junteng_dev junteng order-processor
          origin/junteng_dev junteng product-catalog
          origin/junteng_dev junteng reminder-service
          origin/junteng_dev junteng shipment-tracker
          origin/junxian_dev junxian qr-generator
          origin/junxian_dev junxian social-connector
          origin/junxian_dev junxian translation-api
          origin/lueyang-dev lueyang activity-logger
          origin/lueyang-dev lueyang client-portal
          origin/lueyang-dev lueyang crm-system
          origin/lueyang-dev lueyang deal-manager
          origin/lueyang-dev lueyang email-campaign
          origin/lueyang-dev lueyang follow-up-reminder
          origin/lueyang-dev lueyang sales-pipeline
          origin/lueyang-dev lueyang territory-manager
          origin/lv lv analytics-dashboard
          origin/lv lv chat-bot
          origin/lv lv feedback-collector
          origin/lv lv personalization-service
          origin/lv lv sentiment-analyzer
          origin/lv lv survey-builder
          origin/lv lv voice-processor
          origin/ruige ruige canvas-automation
          origin/ruige ruige data-analytics
          origin/ruige ruige expense-tracker
          origin/ruige ruige file-manager
          origin/ruige ruige log-analyzer
          origin/ruige ruige web-crawler
          origin/wenshuo-dev wenshuo cache-optimizer
          origin/wenshuo-dev wenshuo image-processor
          origin/wenshuo-dev wenshuo scheduler
          origin/wenshuo-dev wenshuo search-engine
          origin/xiaochen_dev xiaochen backup-utility
          origin/xiaochen_dev xiaochen deployment-tool
          origin/xiaochen_dev xiaochen error-tracker
          origin/xiaochen_dev xiaochen health-monitor
          origin/xiaochen_dev xiaochen monitoring-agent
          origin/xiaochen_dev xiaochen security-scanner
          origin/xiaochen_dev xiaochen status-checker
          origin/yuxuan-dev yuxuan asset-optimizer
          origin/yuxuan-dev yuxuan content-manager
          origin/yuxuan-dev yuxuan network-analyzer
          origin/yuxuan-dev yuxuan sync-service
          origin/yuxuan-dev yuxuan task-scheduler
          origin/yuzhen-dev yuzhen alert-system
          origin/yuzhen-dev yuzhen data-validator
          origin/yuzhen-dev yuzhen form-builder
          origin/yuzhen-dev yuzhen invoice-generator
          origin/yuzhen-dev yuzhen payment-processor
          origin/yuzhen-dev yuzhen permission-manager
          origin/zhaochen zhaochen certificate-manager
          origin/zhaochen zhaochen load-balancer
          origin/zhaochen zhaochen storage-manager
          origin/zhaochen zhaochen template-engine
          EOF
          )

          while read -r branch dev task; do
            [ -z "${branch:-}" ] && continue
            echo "Copying ${dev}/${task} from ${branch}"
            git archive "${branch}" "tasks/${dev}/${task}" | tar -x --strip-components=2 -C tasks/finalpool
          done <<< "$ENTRIES"

          printf '%s\n' 'Final pool of implemented tasks from BenchTasksCollv3 (checked against tasks/examples requirements).' > tasks/finalpool/readme.txt
          git add tasks
          git commit -m "Add implemented tasks to finalpool"
          git branch -M finalpool
          git push --force origin finalpool
